name: Connect to Certum cloud signing
description: Validate unattended credentials, verify the pinned installer and connect to the configured certificate.
inputs:
  username:
    required: true
    description: SimplySign account
  otp-uri:
    required: true
    description: TOTP provisioning URI
  thumbprint:
    required: true
    description: Expected SHA-1 certificate thumbprint
runs:
  using: composite
  steps:
    - name: Validate unattended signing credentials
      shell: pwsh
      env:
        CERTUM_USERNAME: ${{ inputs.username }}
        CERTUM_OTP_URI: ${{ inputs.otp-uri }}
        CERTUM_KEY_ID: ${{ inputs.thumbprint }}
      run: node "${{ github.action_path }}/../../../scripts/validate-certum-configuration.mjs"
    - name: Install verified SimplySign client
      shell: pwsh
      run: '& "${{ github.action_path }}/../../../scripts/certum/Install-SimplySign.ps1"'
    - name: Authenticate cloud certificate
      shell: pwsh
      env:
        CERTUM_USERNAME: ${{ inputs.username }}
        CERTUM_OTP_URI: ${{ inputs.otp-uri }}
        CERTUM_KEY_ID: ${{ inputs.thumbprint }}
        CAPTURE_DIAGNOSTICS: 'false'
      run: '& "${{ github.action_path }}/../../../scripts/certum/Connect-SimplySign.ps1"'
    - name: Verify expected signing certificate
      shell: pwsh
      env:
        CERTUM_KEY_ID: ${{ inputs.thumbprint }}
      run: |
        $certificate = @(Get-ChildItem Cert:\CurrentUser\My | Where-Object { $_.Thumbprint -eq $env:CERTUM_KEY_ID -and $_.EnhancedKeyUsageList -like '*Code Signing*' })
        if ($certificate.Count -ne 1 -or $certificate[0].NotAfter -le (Get-Date) -or $certificate[0].NotBefore -gt (Get-Date)) {
          throw 'Expected current Certum code-signing certificate is unavailable.'
        }
        Write-Host 'Expected Certum code-signing certificate is available; actual signatures must still pass trust and timestamp verification.'
