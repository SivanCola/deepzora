name: Certum signing smoke test

on:
  workflow_dispatch:
    inputs:
      client_probe_only:
        description: Inspect the pinned client's login controls without credentials or signing
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: certum-signing
  cancel-in-progress: false

jobs:
  client-probe:
    if: github.repository == 'SivanCola/deepzora' && inputs.client_probe_only
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - name: Probe official client control roles without credentials
        shell: pwsh
        run: ./scripts/certum-client-probe.ps1
  sign:
    if: github.repository == 'SivanCola/deepzora' && github.ref == 'refs/heads/main' && github.ref_protected && !inputs.client_probe_only
    runs-on: windows-2022
    environment: release
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.workflow_sha }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version-file: .node-version
      - name: Check signing configuration
        shell: pwsh
        env:
          CERTUM_USERNAME: ${{ secrets.CERTUM_USERNAME }}
          CERTUM_OTP_URI: ${{ secrets.CERTUM_OTP_URI }}
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: node scripts/validate-certum-configuration.mjs
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Build open-source signing probes
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          # This minimal probe is covered by the repository's AGPL-3.0-only license.
          New-Item -ItemType Directory payload | Out-Null
          'package main; func main() { println("Deepzora Certum signing probe") }' | Set-Content probe.go
          $env:GOOS = 'windows'
          $env:CGO_ENABLED = '0'
          foreach ($arch in @('amd64', 'arm64')) {
            $env:GOARCH = $arch
            go build -trimpath -o "payload/probe-$arch.exe" probe.go
            if ($LASTEXITCODE -ne 0) { throw 'Probe compilation failed' }
          }
          @('probe-amd64.exe', 'probe-arm64.exe') | Set-Content payload/signing-files.txt
          Copy-Item payload/probe-amd64.exe installer-probe.exe

      - name: Connect to SimplySign cloud certificate
        uses: ./.github/actions/setup-certum
        with:
          username: ${{ secrets.CERTUM_USERNAME }}
          otp-uri: ${{ secrets.CERTUM_OTP_URI }}
          thumbprint: ${{ secrets.CERTUM_KEY_ID }}

      - name: Sign and verify payload and installer probes
        shell: pwsh
        env:
          CERTUM_KEY_ID: ${{ secrets.CERTUM_KEY_ID }}
        run: |
          ./scripts/sign-certum.ps1 -PayloadDirectory payload
          ./scripts/sign-certum.ps1 -FilePath installer-probe.exe
          'Certum x64/ARM64 payload and installer signing, expected signer, trust, and timestamps passed.' >> $env:GITHUB_STEP_SUMMARY

      - name: Disconnect from Certum
        if: always()
        shell: pwsh
        run: Get-Process -Name '*SimplySign*' -ErrorAction SilentlyContinue | Stop-Process -Force
