name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, 'codex/team-port-*']
  workflow_dispatch:
    inputs:
      team_acceptance:
        description: Build native Team qualification artifacts without publishing
        type: boolean
        default: false
      team_require_secrets:
        description: Require the enabled secret flow in the packaged candidate
        type: boolean
        default: true

env:
  MINISIGN_PUBLIC_KEY: ${{ vars.MINISIGN_PUBLIC_KEY }}

permissions:
  contents: read

concurrency:
  # Keep main SHA runs distinct so release qualification can verify the exact
  # code ancestor; superseded PR runs share a group and are cancelled.
  group: ci-${{ github.event_name == 'workflow_dispatch' && github.run_id || github.event_name == 'push' && github.sha || github.ref }}
  cancel-in-progress: true

jobs:
  team-native-acceptance:
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.team_acceptance }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      TEAM_REQUIRE_SECRETS: ${{ inputs.team_require_secrets && '1' || '0' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            desktop/go.sum
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm --dir desktop install --frozen-lockfile
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-sandbox
      - if: runner.os == 'Linux'
        run: |
          go install github.com/goreleaser/nfpm/v2/cmd/nfpm@v2.46.3
          pnpm --dir desktop/frontend exec playwright install --with-deps chromium
      - if: runner.os == 'macOS'
        run: brew install create-dmg
      - if: runner.os == 'Windows'
        run: pwsh -NoProfile -File scripts/install-nsis.ps1
      - name: Qualify native Team package
        if: runner.os != 'Linux'
        run: node scripts/team-native-acceptance.mjs
      - name: Qualify native Team package in Xvfb
        if: runner.os == 'Linux'
        run: xvfb-run -a node scripts/team-native-acceptance.mjs
      - if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: team-native-${{ runner.os }}-${{ github.sha }}
          path: |
            desktop/build/team-acceptance
            dist/Deepzora-*
          if-no-files-found: error

  # Keep required contexts visible for unrelated changes. Unknown input or a
  # failed detector runs checks conservatively, and desktop aggregation also
  # requires successful detection. Main pushes retain the notes-only exception.
  changes:
    runs-on: ubuntu-latest
    outputs:
      code: ${{ steps.filter.outputs.code }}
      desktop: ${{ steps.filter.outputs.desktop }}
      desktop_plan: ${{ steps.filter.outputs.desktop_plan }}
      sdk: ${{ steps.filter.outputs.sdk }}
      release_control: ${{ steps.filter.outputs.release_control }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          args=(--head "$HEAD_SHA" --github-output "$GITHUB_OUTPUT" --summary "$GITHUB_STEP_SUMMARY")
          if [ "$EVENT_NAME" = pull_request ]; then
            args+=(--base "$BASE_SHA" --mode pull_request)
          elif [ "$EVENT_NAME" = workflow_dispatch ]; then
            args+=(--full)
          else
            # Main pushes retain the complete qualification matrix after the
            # existing release-notes-only exception is evaluated.
            args+=(--base "$BASE_SHA" --mode push --full)
          fi
          node scripts/ci-paths.mjs "${args[@]}"

  # Preserve the required per-OS contexts and execute each root suite once.
  test:
    needs: changes
    if: ${{ !cancelled() }}
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    env:
      RUN_STEPS: ${{ needs.changes.result != 'success' || needs.changes.outputs.code != 'false' }}
      DEEPZORA_RELEASE_CACHE_GUARD: "1"
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: env.RUN_STEPS == 'true'
        uses: ./.github/actions/go-build-cache
        with:
          module: root
          dependency: go.sum
      - if: env.RUN_STEPS == 'true'
        run: go mod download
      - if: env.RUN_STEPS == 'true' && runner.os == 'Linux'
        uses: ./.github/actions/linux-sandbox
      # go test also compiles packages without test files and fails on their errors.
      - name: Build and test root module
        if: env.RUN_STEPS == 'true'
        run: go test -timeout=15m ./...
      - if: always() && env.RUN_STEPS == 'true'
        uses: ./.github/actions/go-build-cache
        with:
          module: root
          dependency: go.sum
          mode: save

  windows-root:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    name: windows-root
    runs-on: windows-latest
    timeout-minutes: 35
    defaults:
      run:
        shell: bash
    env:
      DEEPZORA_RELEASE_CACHE_GUARD: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - uses: ./.github/actions/go-build-cache
        with:
          module: root
          dependency: go.sum
      - run: go mod download
      - uses: ./.github/actions/windows-root-tools
      - uses: ./.github/actions/windows-test-temp
      - name: Test both Windows PowerShell runtimes
        shell: pwsh
        run: |
          foreach ($program in @('pwsh', 'powershell.exe')) {
            $env:DEEPZORA_TEST_PWSH = (Get-Command $program).Source
            go test -count=1 -timeout=2m -run '^TestPowerShell' ./internal/persistentshell
            if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          }
      # The runner fails unless every discovered package reports pass or skip.
      - name: Build and test every root package
        run: node scripts/ci-windows-root.mjs "$RUNNER_TEMP/windows-root"
      - name: Upload root package evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: windows-root-${{ github.run_id }}
          path: ${{ runner.temp }}/windows-root
          overwrite: true
          retention-days: 14
          if-no-files-found: error
      - if: always()
        uses: ./.github/actions/go-build-cache
        with:
          module: root
          dependency: go.sum
          mode: save

  test-windows:
    name: test (windows-latest)
    needs: [changes, windows-root]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Require successful detection and planned execution
        env:
          CHANGES_RESULT: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          ROOT_RESULT: ${{ needs.windows-root.result }}
        run: |
          test "$CHANGES_RESULT" = success
          case "$CODE" in
            true) test "$ROOT_RESULT" = success ;;
            false) test "$ROOT_RESULT" = skipped ;;
            *) exit 1 ;;
          esac

  timings:
    name: timings
    needs: [changes, test, windows-root, test-windows, root, race, desktop-frontend, desktop-tests, desktop-browser, desktop-go, desktop, lint]
    if: ${{ always() && !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    continue-on-error: true
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Collect CI timing evidence
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/ci-collect.mjs --run "$GITHUB_RUN_ID" --output "$RUNNER_TEMP/ci-evidence"
      - name: Upload timing evidence
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: ci-timings-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/ci-evidence
          retention-days: 14
          if-no-files-found: error

  # The extension-protocol and release-control contracts are platform-independent.
  root:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_STEPS: ${{ needs.changes.result != 'success' || needs.changes.outputs.code != 'false' || needs.changes.outputs.sdk != 'false' || needs.changes.outputs.release_control != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      # The root namespace belongs to the test matrix; this job resolves only
      # actionlint, so it restores and saves its own namespace
      # rather than freezing a small cache under the one test depends on.
      - if: env.RUN_STEPS == 'true'
        uses: ./.github/actions/go-build-cache
        with:
          module: root-tools
          dependency: go.sum
      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Validate workflows
        if: env.RUN_STEPS == 'true'
        run: |
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 \
            -ignore 'label "windows-11-arm" is unknown' \
            -ignore 'label "macos-15-intel" is unknown'
      - name: Verify CI and release contracts
        if: env.RUN_STEPS == 'true'
        run: |
          node --test scripts/*.test.mjs npm/publish.test.mjs
          bash scripts/validate-release-candidate-source.test.sh
          bash scripts/validate-release-control-plane.test.sh
          bash scripts/verify-release-push-ci.test.sh
          bash scripts/release-stable.test.sh
          bash scripts/release-approve.test.sh
          bash scripts/release-candidate-tags.test.sh
          bash scripts/verify-release-authorization.test.sh
          bash scripts/release-workflows.test.sh
          node scripts/check-single-release-public-contract.mjs
      # The lint job owns module-cache writes for root-tools.
      - if: always() && env.RUN_STEPS == 'true'
        uses: ./.github/actions/go-build-cache
        with:
          module: root-tools
          dependency: go.sum
          save_mod_os: ''
          mode: save

  race:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.code != 'false') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      DEEPZORA_RELEASE_CACHE_GUARD: "1"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          module: root-race
          dependency: go.sum
      - run: go mod download
      - uses: ./.github/actions/linux-sandbox
      - name: Check concurrent runtime owners
        run: |
          go test -race -timeout=15m ./internal/agent/... ./internal/plugin/... ./internal/jobs/... \
            ./internal/proc/... ./internal/sandbox/... ./internal/filelock/... ./internal/eventwire/... \
            ./internal/extension/... ./internal/boot/... ./internal/control/... \
            ./internal/tool/... ./internal/config/... ./internal/session/... \
            ./internal/sessioninbox/... ./internal/team/... ./internal/teamroster/... ./internal/hostframe/...
      - if: always()
        uses: ./.github/actions/go-build-cache
        with:
          module: root-race
          dependency: go.sum
          mode: save

  desktop-frontend:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop_plan == '' || fromJSON(needs.changes.outputs.desktop_plan).build) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    env:
      DEEPZORA_COMMIT: ${{ github.sha }}
    outputs:
      producer_attempt: ${{ steps.identity.outputs.attempt }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          module: desktop
          dependency: desktop/go.sum
          build_module: desktop-contract
      - run: go mod download
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Verify generated host contract
        run: |
          go run ./cmd/desktop -emit-contract frontend/src/generated
          git diff --exit-code -- frontend/src/generated
      - name: Build frontend once
        run: pnpm --dir frontend build:electron
      - name: Record artifact identity
        id: identity
        run: |
          echo "attempt=$GITHUB_RUN_ATTEMPT" >> "$GITHUB_OUTPUT"
          node frontend/scripts/artifact-identity.mjs create --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" \
            --attempt "$GITHUB_RUN_ATTEMPT" --pnpm-version "$(pnpm --version)"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: desktop-frontend-${{ github.run_id }}
          path: |
            desktop/frontend/dist
            desktop/frontend/.deepzora-frontend-artifact.json
          include-hidden-files: true
          if-no-files-found: error
          overwrite: true
          retention-days: 7
      - if: always()
        uses: ./.github/actions/go-build-cache
        with:
          module: desktop
          dependency: desktop/go.sum
          build_module: desktop-contract
          save_mod_os: ''
          mode: save

  desktop-tests:
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop_plan == '' || fromJSON(needs.changes.outputs.desktop_plan).tests) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    env:
      DEEPZORA_COMMIT: ${{ github.sha }}
      DEEPZORA_TEST_CONCURRENCY: "2"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - name: Test frontend once per suite
        run: node frontend/scripts/run-ci-tests.mjs
      - name: Test and build Electron
        run: |
          pnpm --dir electron typecheck
          pnpm --dir electron test
          pnpm --dir electron build
          node --test packaging/*.test.mjs

  desktop-browser:
    needs: [changes, desktop-frontend]
    if: ${{ !cancelled() && needs.desktop-frontend.result == 'success' && (needs.changes.result != 'success' || needs.changes.outputs.desktop_plan == '' || fromJSON(needs.changes.outputs.desktop_plan).browser) }}
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          version: 10.34.5
          run_install: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
          cache: pnpm
          cache-dependency-path: desktop/pnpm-lock.yaml
      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8
        with:
          name: desktop-frontend-${{ github.run_id }}
          path: desktop/frontend
      - name: Verify frontend artifact
        run: |
          node frontend/scripts/artifact-identity.mjs verify --shell electron --channel stable \
            --source-sha "$(git rev-parse HEAD)" --run-id "$GITHUB_RUN_ID" \
            --attempt "${{ needs.desktop-frontend.outputs.producer_attempt }}" --pnpm-version "$(pnpm --version)"
      - name: Check transcript and approval behavior in Chromium
        run: |
          PLAYWRIGHT_BROWSERS_PATH=.pw-browsers pnpm --dir frontend exec playwright install --with-deps chromium
          xvfb-run -a pnpm --dir frontend test:motion-browser
          xvfb-run -a pnpm --dir frontend test:transcript-browser
          xvfb-run -a pnpm --dir frontend test:team-browser
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - name: Check the packaged CLI Web workspace with the real service
        working-directory: .
        run: |
          CGO_ENABLED=0 go build -o "$RUNNER_TEMP/deepzora" ./cmd/deepzora
          python3 -m venv "$RUNNER_TEMP/web-playwright"
          # Match the frontend's Playwright so both drive the Chromium build
          # installed above; older releases cannot provision this runner image.
          export PLAYWRIGHT_BROWSERS_PATH="$GITHUB_WORKSPACE/desktop/.pw-browsers"
          "$RUNNER_TEMP/web-playwright/bin/pip" install playwright==1.64.0
          "$RUNNER_TEMP/web-playwright/bin/python" -m playwright install --with-deps chromium
          "$RUNNER_TEMP/web-playwright/bin/python" scripts/test-web-workspace.py "$RUNNER_TEMP/deepzora" --evidence "$RUNNER_TEMP/web-workspace-evidence"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        if: always()
        with:
          name: web-workspace-${{ github.run_id }}
          path: ${{ runner.temp }}/web-workspace-evidence
          if-no-files-found: ignore

  desktop-go:
    name: desktop-go (${{ matrix.os }})
    # The Electron frontend is not embedded in the Go service. Validate both
    # independently; the desktop gate below still requires both to pass.
    needs: changes
    if: ${{ !cancelled() && (needs.changes.result != 'success' || needs.changes.outputs.desktop_plan == '' || fromJSON(needs.changes.outputs.desktop_plan).native) }}
    # The full Windows desktop suite can exceed 25 minutes without a stuck test.
    # Allow 35 minutes for tests plus cold compilation, vet, lint and cache work.
    timeout-minutes: ${{ matrix.os == 'windows-latest' && 65 || 35 }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: desktop
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: desktop/go.mod
          cache: false
      - uses: ./.github/actions/go-build-cache
        with:
          module: desktop
          dependency: desktop/go.sum
      - run: go mod download
      - if: runner.os == 'Linux'
        uses: ./.github/actions/linux-sandbox
      - uses: ./.github/actions/windows-test-temp
        if: runner.os == 'Windows'
      # go test compiles every package, including those without tests, and the
      # golangci-lint step below runs govet natively on each platform.
      - name: Test desktop module
        env:
          DESKTOP_TEST_TIMEOUT: ${{ runner.os == 'Windows' && '35m' || '15m' }}
        run: |
          args=(-timeout="$DESKTOP_TEST_TIMEOUT" -json)
          if [ "$RUNNER_OS" = Windows ]; then args+=(-count=1); fi
          go test "${args[@]}" ./...
      - name: Check desktop lifecycle races on macOS
        if: runner.os == 'macOS'
        run: go test -race -timeout=10m -run 'Test.*(Title|BotConnection|Deferred|Terminal|DarwinWorkspaceWatcher|DesktopTeam)' .
      - name: Check Team host lifecycle races
        if: runner.os != 'Windows'
        run: go test -race -timeout=5m ./internal/teamhost
      - name: Check native build tags
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          working-directory: desktop
          args: --timeout=5m
      - if: always()
        uses: ./.github/actions/go-build-cache
        with:
          module: desktop
          dependency: desktop/go.sum
          mode: save

  desktop:
    needs: [changes, desktop-frontend, desktop-tests, desktop-browser, desktop-go]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Require complete desktop evidence
        env:
          DESKTOP_PLAN: ${{ needs.changes.outputs.desktop_plan }}
          CI_NEEDS: ${{ toJSON(needs) }}
        run: node scripts/ci-plan.mjs

  lint:
    needs: changes
    if: ${{ !cancelled() }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      RUN_STEPS: ${{ needs.changes.result != 'success' || needs.changes.outputs.code != 'false' || needs.changes.outputs.desktop != 'false' || needs.changes.outputs.sdk != 'false' }}
    steps:
      - if: env.RUN_STEPS == 'true'
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - if: env.RUN_STEPS == 'true'
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: false
      - if: env.RUN_STEPS == 'true'
        uses: ./.github/actions/go-build-cache
        with:
          module: root-tools
          dependency: go.sum
      - name: Check formatting and repository standards
        if: env.RUN_STEPS == 'true'
        run: |
          test -z "$(git ls-files '*.go' | xargs gofmt -l)"
          go run ./tools/repolint
          go run ./tools/testdup -strict
      - name: Lint root module
        if: env.RUN_STEPS == 'true'
        uses: golangci/golangci-lint-action@ba0d7d2ec06a0ea1cb5fa41b2e4a3ab91d21278a # v9
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Lint root platform tags
        if: env.RUN_STEPS == 'true'
        run: |
          for target in darwin windows; do
            GOOS="$target" golangci-lint run --timeout=5m ./...
          done
      - if: always() && env.RUN_STEPS == 'true'
        uses: ./.github/actions/go-build-cache
        with:
          module: root-tools
          dependency: go.sum
          mode: save
