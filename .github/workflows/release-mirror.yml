name: Sync release downloads to R2
run-name: Mirror release ${{ inputs.version }} to R2

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Already-published stable version, for example 0.0.2"
        required: true
        type: string
  workflow_call:
    inputs:
      version:
        required: true
        type: string
    secrets:
      R2_ACCESS_KEY_ID:
        required: true
      R2_SECRET_ACCESS_KEY:
        required: true
      R2_ACCOUNT_ID:
        required: true
      R2_BUCKET:
        required: true

permissions:
  contents: read

concurrency:
  group: r2-release-downloads
  cancel-in-progress: false

jobs:
  mirror:
    name: verify and mirror public release bytes
    if: github.repository == 'SivanCola/deepzora' && github.ref == 'refs/heads/main' && github.ref_protected && vars.ENABLE_R2_DOWNLOADS == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          ref: ${{ github.sha }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7
        with:
          node-version-file: .node-version
      - name: Install pinned R2 S3 client
        run: |
          python3 -m venv "$RUNNER_TEMP/r2-cli"
          "$RUNNER_TEMP/r2-cli/bin/pip" --disable-pip-version-check install awscli==1.46.2
          echo "$RUNNER_TEMP/r2-cli/bin" >> "$GITHUB_PATH"
      - name: Sync and read back every release object
        env:
          GH_TOKEN: ${{ github.token }}
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
          R2_PUBLIC_BASE: ${{ vars.R2_PUBLIC_BASE }}
          R2_MIRROR_REPORT: ${{ runner.temp }}/r2-mirror-report.json
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/release-r2-mirror.mjs "$RELEASE_VERSION"
      - name: Save verified mirror inventory
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: r2-mirror-${{ inputs.version }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/r2-mirror-report.json
          if-no-files-found: error
          retention-days: 90
